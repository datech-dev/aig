name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
          cd /var/www/aig
          git fetch origin main
          git reset --hard origin/main
          touch .env
          grep -q "^RAZORPAY_KEY_ID=" .env && sed -i 's|^RAZORPAY_KEY_ID=.*|RAZORPAY_KEY_ID=rzp_live_TkKVJLqWR1OmdL|' .env || echo "RAZORPAY_KEY_ID=rzp_live_TkKVJLqWR1OmdL" >> .env
          grep -q "^RAZORPAY_KEY_SECRET=" .env && sed -i 's|^RAZORPAY_KEY_SECRET=.*|RAZORPAY_KEY_SECRET=C9xubu4iHN8PaMF8Mcw11N8O|' .env || echo "RAZORPAY_KEY_SECRET=C9xubu4iHN8PaMF8Mcw11N8O" >> .env
          grep -q "^PAYMENT_GATEWAY=" .env && sed -i 's|^PAYMENT_GATEWAY=.*|PAYMENT_GATEWAY=razorpay|' .env || echo "PAYMENT_GATEWAY=razorpay" >> .env
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            grep -q "^TELEGRAM_BOT_TOKEN=" .env && sed -i 's|^TELEGRAM_BOT_TOKEN=.*|TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}|' .env || echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          fi
          sudo apt-get update && sudo apt-get install -y python3-pip python3-venv nginx certbot python3-certbot-nginx
          python3 -m venv .venv || true
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          chmod +x setup_nginx_ssl.sh
          bash setup_nginx_ssl.sh || true
          sudo cp karin-bot.service /etc/systemd/system/karin-bot.service || true
          sudo systemctl daemon-reload
          sudo systemctl restart karin-bot
          sudo systemctl status karin-bot --no-pager || true
